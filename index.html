<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCK, PAPER, SCISSORS</title>

    <style>
        body {
            background-color: #767679;
        }
        .container{
            display: flex;
            flex-direction: column;
        }
        .container.button {
            display: flex;
        }

        button {
        padding: 15px 30px;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: linear-gradient(135deg, #70ed76 0%, #764ba2 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        transition: all 0.3s ease;
    }
    
    button.btn-scelta.selected {
            background-color: orange;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 165, 0, 0.6);
    }

    .selected {
        background-color: orange;
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(255, 165, 0, 0.6);
    }


        .card {
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            justify-content: space-around;
            font-size: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;         
        }

        .card.pc-box,
        .card.human-box {
            flex-direction: row;
        }

        .card.inBox {
            flex-direction: row;
            
        }

    </style>
</head>
<body>
   <script defer src="script.js" ></script> 


<div class="container">
    <button id="hmn">Your Choice</button>
    <button id="pc">Computer Choice</button>
    <button id="playR">Play Round</button>
</div>




</body>
</html>
